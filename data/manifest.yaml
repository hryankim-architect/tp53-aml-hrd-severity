# Public-data manifest -- tp53-aml-hrd-severity (P3 capability portrait)
#
# This manifest is the SINGLE source of truth for every public input the demo
# consumes. `make data` downloads each entry and verifies its SHA-256, so a
# fresh clone reproduces the exact bytes the pipeline was built on.
#
# All inputs are NIH GDC open-tier (no controlled-access auth). Two sources:
#
#   1. clinical:  one POST to the GDC /cases endpoint for the TCGA-LAML project
#                 (survival fields). The raw JSON response is byte-stable for a
#                 fixed query, so its sha256 is pinned directly.
#   2. inputs:    153 per-aliquot WXS "aliquot ensemble masked" somatic MAFs
#                 (open tier) for TCGA-LAML, each fetched by GDC file UUID from
#                 the /data endpoint. GDC stores these as immutable artifacts,
#                 so each file's sha256 is stable across downloads/machines.
#
# Total raw MAF bytes: 1,562,904 (~1.56 MB) -- well within the README's
# "make run finishes in minutes" budget.
#
# To regenerate after GDC adds/removes files (a PR-sized decision):
#   python -m tp53_hrd.pipeline refresh-manifest        # re-enumerate file set
#   python -m tp53_hrd.pipeline fetch --write-checksums  # download + fill sha256
# then review the diff and commit. Every later `make data` re-verifies each hash.
#
# Schema:
#   clinical: { endpoint, method, project, fields[], path, sha256, license, source }
#   inputs:   - { url, path, sha256, size_bytes, license, source }

clinical:
  endpoint: https://api.gdc.cancer.gov/cases
  method: POST
  project: TCGA-LAML
  fields:
    - submitter_id
    - demographic.vital_status
    - demographic.days_to_death
    - diagnoses.days_to_last_follow_up
    - diagnoses.age_at_diagnosis
  size: 500
  path: tcga-laml/clinical.json
  sha256: 067366dd9b9f24c37489f0a1b7c1ee26f8e259cadbf8f1cece7d7c9d7d1e3f43
  license: NIH GDC Data Use Agreement (open tier)
  source: TCGA-LAML clinical metadata, GDC /cases endpoint

